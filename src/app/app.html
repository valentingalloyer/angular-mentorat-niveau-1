<app-header></app-header>

<main class="container">

  <app-ex1></app-ex1>

  <h2>Liste de tâches</h2>

  <!-- Bouton *ngIf -->
  <button (click)="showList = !showList">
    {{ showList ? 'Masquer' : 'Afficher' }} la liste
  </button>

  <!-- *ngIf -->
  <div *ngIf="showList">
    <!-- Ajout d’une tâche -->
    <input
      type="text"
      placeholder="Nouvelle tâche"
      #taskInput
    />
    <button (click)="addTask(taskInput.value); taskInput.value = ''">
      Ajouter
    </button>

    <!-- Liste avec *ngFor -->
    <ul>
      <li *ngFor="let task of tasks; let i = index">
        {{ task }}
        <button (click)="removeTask(i)">Supprimer</button>
      </li>
    </ul>
  </div>


</main>
