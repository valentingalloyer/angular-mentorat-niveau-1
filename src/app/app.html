<app-header></app-header>

<main class="container">
  <h2>Liste de tâches</h2>

  <button (click)="showList = !showList">
    Afficher / masquer la liste
  </button>

  <div *ngIf="showList">
    <!-- Ajout tâche (sans ngModel) -->
    <input type="text" placeholder="Nouvelle tâche" #taskInput />
    <button (click)="addTask(taskInput.value); taskInput.value = ''">
      Ajouter
    </button>

    <!-- Chargement API -->
    <button (click)="loadFromApi()">
      Charger depuis l’API (mock)
    </button>

    <div class="list">
      <app-task-item
        *ngFor="let task of tasks; let i = index"
        [task]="task"
        (done)="removeTask(i)"
      ></app-task-item>
    </div>
  </div>
</main>
